[project]
name = "research-assistant"
version = "0.1.0"
description = "Multi-agent research assistant: a team of agents researches a question and delivers a cited PDF."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastembed>=0.9.1",
    "langchain-core>=1.7.5",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.19",
    "markdown-it-py>=4.2.0",
    "mcp>=2.3.0",
    "pydantic>=2.14.2",
    "pypdf>=6.21.4",
    "pyyaml>=6.0.3",
    "tavily-python>=0.8.5",
    "weasyprint>=70.0",
]

[project.scripts]
research-assistant = "research_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
