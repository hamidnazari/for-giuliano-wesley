[project]
name = "research-assistant"
version = "0.1.0"
description = "Multi-agent research assistant: a team of agents researches a question and delivers a cited PDF."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
research-assistant = "research_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant"]
