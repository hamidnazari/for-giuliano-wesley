repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: mise run secrets:staged
        language: system
        pass_filenames: false
      - id: format
        name: ruff format
        entry: mise run format
        language: system
        types: [python]
        pass_filenames: false
      - id: lint
        name: ruff check
        entry: mise run lint
        language: system
        types: [python]
        pass_filenames: false
      - id: typecheck
        name: pyright
        entry: mise run typecheck
        language: system
        types: [python]
        pass_filenames: false
