# Models are provider/model IDs served by the Kilo gateway.
# The Critic must come from a different provider than the Researchers, so the two
# do not share blind spots. Startup validation enforces this.
rubric_version: "1"
critic_rubric: critic_rubric.md
report_check_prompt: report_check.md

planner:
  model: anthropic/claude-sonnet-4.6
  prompt: planner.md
  tools: []
  limits: {clarifying_questions: 3}

researcher:
  model: anthropic/claude-haiku-4.5
  prompt: researcher.md
  tools: [web_search, docs_retrieve]
  limits: {searches: 6}

critic:
  model: openai/gpt-5.4
  prompt: critic.md
  tools: [fetch_cited_passage]

writer:
  model: anthropic/claude-sonnet-4.6
  prompt: writer.md
  tools: [render_report]
  limits: {repairs: 2}
