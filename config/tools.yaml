tools:
  web_search: {source: native, risk: read}          # Tavily
  docs_retrieve: {source: native, risk: read}
  fetch_cited_passage: {source: native, risk: read}
  render_report: {source: native, risk: write}      # writes inside the project folder only

search:
  search_depth: basic
  max_results: 5

ingestion:
  chunk_size: 800
  chunk_overlap: 100
  embedding_model: BAAI/bge-small-en-v1.5
  top_k: 4
  min_score: 0.5   # bge-small scored relevant chunks 0.63-0.86 and unrelated ones 0.37-0.45
